defaults:
  - _self_
  - env: dmc
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

log_dir: log
name: default
seed: 0
device: null
debug: false

buffer_size: 1000000
batch_size: 512
train_frames: 1000000
warmup_frames: 10000
random_frames: 10000
eval_frames: 10000
eval_episodes: 10
log_frames: 1000
norm_obs: true
norm_reward: false
max_episode_steps: null

algo:
  discount: 0.99
  tau: 0.005
  actor_update_freq: 1
  target_update_freq: 1
  actor_hidden_dims: [512, 512, 512]
  critic_lr: 0.0003
  actor_lr: 0.0003
  target_policy_noise: 0.2
  noise_clip: 0.3
  exploration_noise: 0.2
  diagonal_m: false
  d_s: 16
  d_a: 16
  phi_s_hidden_dims: [512, 512]
  phi_a_hidden_dims: [512, 512]
  mu_hidden_dims: [512, 512]
  reward_hidden_dims: [512]
  rff_dim: 1024
  num_noises: 25
  linear: false
  ranking: true
  feature_lr: 0.0001
  feature_tau: 0.005
  feature_update_ratio: 1
  reward_coef: 1.0
  ctrl_coef: 1.0
  critic_coef: 1.0
  use_bias: true
  back_critic_grad: false
  critic_type: hybrid
  critic_rff_dim: 1024
  critic_hidden_dims: [512]
  bonus_coef: 0.0
  cov_ema_alpha: 0.1
  lambda_s: 1.0
  lambda_a: 1.0
  bonus_type: factored
  thompson_sampling: true
  adaptive_beta: false

hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
