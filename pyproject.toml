[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastr"
version = "0.1.0"
description = "Factored spectral representations for reinforcement learning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "gymnasium>=1.0,<2",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<2.4",
    "tensorboard>=2.8",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dmc = ["dm_control==1.0.27", "mujoco==3.2.7"]
mujoco = ["mujoco==3.2.7"]
robotics = ["gymnasium-robotics>=1.3,<2", "mujoco==3.2.7"]

[project.scripts]
fastr-train = "fastr.train:main"

[project.urls]
"Base repository" = "https://github.com/spectral-rl/spectral-rl"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["fastr*"]

[tool.setuptools.package-data]
fastr = ["config/*.yaml", "config/env/*.yaml"]

